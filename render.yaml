# render.yaml — Blueprint do Render (deploy com 1 clique: web + PostgreSQL)
# Uso: crie um repositorio no GitHub com este projeto, depois no Render
# clique em "New > Blueprint" e conecte o repositorio. O Render cria tudo.
# Defina ADMIN_EMAIL e ADMIN_PASSWORD no painel do Render apos o primeiro deploy.
services:
  - type: web
    name: pediu-chegou
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PGSSL
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pediuchegou-db
          property: connectionString
databases:
  - name: pediuchegou-db
    plan: free
    databaseName: pediuchegou
    user: pediu
